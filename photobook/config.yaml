project:
  title: "Memories"
  subtitle: "A Collection of Moments"

input:
  directory: "photo"
  recursive: true
  extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".webp"
    - ".tif"
    - ".tiff"
    - ".bmp"

output:
  directory: "artifact"
  filename: "photobook.pdf"
  page_size_mm: 210
  overwrite: false

design:
  margin_mm: 12
  cover_background: "#F5F2EA"
  page_background: "#FFFFFF"
  title_color: "#202020"
