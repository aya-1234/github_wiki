[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photobook"
version = "0.1.0"
description = "Minimalist square photo book PDF generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "reportlab>=4.0",
    "PyYAML>=6.0",
]

[project.scripts]
photobook = "photobook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
